<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b16"/><stop offset=".6" stop-color="#0d2142"/><stop offset="1" stop-color="#1b3a6b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a24b" stop-opacity=".35"/><stop offset="1" stop-color="#c9a24b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1426"/><stop offset="1" stop-color="#030710"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="800" fill="url(#sky)"/>
  <circle cx="1220" cy="250" r="190" fill="url(#glow)"/>
  <!-- far skyline -->
  <g fill="#10284d" opacity=".9">
    <rect x="0" y="420" width="90" height="240"/><rect x="100" y="360" width="70" height="300"/><rect x="180" y="440" width="110" height="220"/>
    <rect x="300" y="330" width="80" height="330"/><rect x="390" y="400" width="120" height="260"/><rect x="520" y="350" width="70" height="310"/>
    <rect x="600" y="430" width="100" height="230"/><rect x="710" y="300" width="90" height="360"/><rect x="810" y="410" width="120" height="250"/>
    <rect x="940" y="360" width="80" height="300"/><rect x="1030" y="440" width="110" height="220"/><rect x="1150" y="320" width="90" height="340"/>
    <rect x="1250" y="400" width="120" height="260"/><rect x="1380" y="350" width="80" height="310"/><rect x="1470" y="430" width="130" height="230"/>
  </g>
  <!-- near skyline with lit windows -->
  <g fill="#0a1a35">
    <rect x="40" y="470" width="130" height="190"/><rect x="230" y="430" width="100" height="230"/><rect x="420" y="480" width="150" height="180"/>
    <rect x="640" y="440" width="110" height="220"/><rect x="860" y="490" width="140" height="170"/><rect x="1080" y="450" width="100" height="210"/>
    <rect x="1290" y="480" width="150" height="180"/>
  </g>
  <g fill="#e2c275" opacity=".55">
    <rect x="60" y="490" width="12" height="16"/><rect x="90" y="520" width="12" height="16"/><rect x="130" y="490" width="12" height="16"/>
    <rect x="250" y="450" width="12" height="16"/><rect x="285" y="490" width="12" height="16"/><rect x="250" y="540" width="12" height="16"/>
    <rect x="450" y="505" width="12" height="16"/><rect x="520" y="540" width="12" height="16"/><rect x="480" y="580" width="12" height="16"/>
    <rect x="665" y="470" width="12" height="16"/><rect x="705" y="520" width="12" height="16"/><rect x="900" y="520" width="12" height="16"/>
    <rect x="960" y="560" width="12" height="16"/><rect x="1100" y="480" width="12" height="16"/><rect x="1140" y="540" width="12" height="16"/>
    <rect x="1320" y="510" width="12" height="16"/><rect x="1390" y="550" width="12" height="16"/>
  </g>
  <!-- road -->
  <rect y="640" width="1600" height="160" fill="url(#road)"/>
  <g stroke="#c9a24b" stroke-width="4" stroke-dasharray="60 50" opacity=".7"><line x1="0" y1="725" x2="1600" y2="725"/></g>
  <!-- delivery van -->
  <g transform="translate(980 560)">
    <rect x="0" y="0" width="190" height="90" rx="10" fill="#f4f1ea"/>
    <path d="M190 24h42l30 32v34h-72z" fill="#e6e1d4"/>
    <path d="M200 32h26l20 22h-46z" fill="#16335f"/>
    <rect x="18" y="38" width="120" height="8" fill="#c9a24b"/>
    <circle cx="52" cy="92" r="20" fill="#0a0f1c"/><circle cx="52" cy="92" r="9" fill="#8b93a3"/>
    <circle cx="216" cy="92" r="20" fill="#0a0f1c"/><circle cx="216" cy="92" r="9" fill="#8b93a3"/>
  </g>
  <ellipse cx="1090" cy="660" rx="170" ry="10" fill="#000" opacity=".35"/>
  <!-- light trails -->
  <g stroke-linecap="round" opacity=".55">
    <line x1="0" y1="690" x2="800" y2="690" stroke="#c9a24b" stroke-width="3"/>
    <line x1="200" y1="760" x2="1100" y2="760" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
